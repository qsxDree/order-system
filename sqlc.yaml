version: "2"
sql:
  - engine: "postgresql"
    schema: "services/order-service/db/migrations"
    queries: "services/order-service/db/queries"
    gen:
      go:
        package: "db"
        out: "services/order-service/internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
